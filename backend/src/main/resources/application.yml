server:
  port: 8080

spring:
  application:
    name: soa-guard-backend
  datasource:
    url: jdbc:h2:mem:soaguarddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

ai-service:
  url: http://localhost:8000/api/v1/ai
